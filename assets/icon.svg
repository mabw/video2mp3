    <rect x="156" y="140" width="48" height="22" rx="4" fill="#d7ecdf"/>
    <rect x="164" y="146" width="9" height="14" fill="#156529"/>
    <rect x="188" y="146" width="9" height="14" fill="#156529"/>
    <rect x="146" y="160" width="68" height="56" rx="14" fill="#ffffff"/>
