# 服务层单测 + 转换集成（双矩阵）+ tag/手动触发的 Windows 打包
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 安装 ffmpeg（Windows runner 不自带）
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ffmpeg
      - run: uv sync
      - run: uv run pytest -v

  build:
    # 打 tag（v*）或手动触发时打包 Windows 发行版；tag 时自动发布到 Releases
    # 测试不绿不发版（v0.1.8 曾因测试红仍发版被坑）
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write  # tag 构建时创建 Release 需要
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 下载外部工具（官方源，runner 直连快）
        shell: pwsh
        run: |
          curl.exe -sS -L --fail -o yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl.exe -sS -L --fail -o ffmpeg-win64-gpl.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
      - name: 打包（复用 scripts/build_windows.ps1：解压 ffmpeg + PyInstaller onedir）
        shell: pwsh
        run: powershell -File scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: shipinguanjia-win64
          path: dist/视频管家/
          if-no-files-found: error
      - name: 发布到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "dist/视频管家/*" -DestinationPath shipinguanjia-win64.zip
          Compress-Archive -Path "assets/extension/*" -DestinationPath douyin-cookie-extension.zip
          gh release create "${{ github.ref_name }}" shipinguanjia-win64.zip douyin-cookie-extension.zip `
            --title "视频管家 ${{ github.ref_name }}" --generate-notes --latest
